server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API accepts proof images up to PROOF_MAX_FILE_SIZE_MB (5 by default).
  # nginx defaults to 1m, so anything larger was refused here with a 413 and
  # never reached the upload handler at all — which looks exactly like a
  # storage failure from the client side.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed assets are immutable; the entry document is not.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Proxy the API so the browser sees one origin and cookies stay first-party.
  location /api/ {
    proxy_pass http://api:4000;
    # A multipart proof is streamed through rather than buffered whole, and
    # given room to finish over a tunnel.
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Client-side routing: unknown paths fall through to the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
