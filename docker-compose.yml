services:
  mongodb:
    image: mongo:7
    container_name: otdms-mongo
    restart: unless-stopped
    # Single-node replica set: transactions require a replica set, and the
    # claim/approve paths use them when available.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Runs once to initiate the replica set, then exits.
  mongo-init:
    image: mongo:7
    container_name: otdms-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try {
            rs.status();
            print("replica set already initiated");
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});
            print("replica set initiated");
          }
        '

  redis:
    image: redis:7-alpine
    container_name: otdms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: otdms-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Read first, so anything set here can be overridden by the explicit
    # block below. This is where the Cloudinary credentials actually live —
    # Compose substitutes ${...} from a .env beside *this file*, not from
    # server/.env, so without this the container was handed empty strings and
    # every upload failed with "File storage is not configured".
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      MONGO_URI: mongodb://mongodb:27017/otdms?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      # Overridable, because the browser sends an Origin header on every
      # same-origin POST too. Hardcoded to localhost, corsPolicy() rejects
      # every write the moment the app is reached through any other
      # hostname — a public tunnel URL included.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: localhost
      # Override these in a real deployment. Generate: openssl rand -hex 48
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_for_local_compose_only}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_for_local_compose_only}
      LOG_LEVEL: info
      # Off unless the root .env turns it on. Lets a demonstration complete a
      # pay-in without dropping the deployment out of production mode.
      ALLOW_PAYMENT_SIMULATION: ${ALLOW_PAYMENT_SIMULATION:-false}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Demo@12345}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-OTDMS <no-reply@otdms.local>}
      # Deliberately NOT listed here. An entry in `environment:` always wins
      # over `env_file:`, so naming them with a `:-` default would set them to
      # empty whenever the host shell has no value — which is exactly the bug
      # this replaced. They come from server/.env above.
      #
      # Uploads still work without them: storage.service.ts falls back to local
      # disk rather than refusing, which is why the volume below exists.
    ports:
      - "4000:4000"
    volumes:
      # Where uploads land when Cloudinary is not configured. Named rather than
      # bind-mounted so it survives the container being replaced, which is the
      # one weakness of the local fallback worth mitigating.
      - api_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Relative paths: nginx proxies /api and /socket.io to the API
        # container, so the browser sees a single origin and cookies stay
        # first-party.
        VITE_API_URL: /api/v1
        VITE_SOCKET_URL: ""
    container_name: otdms-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
    volumes:
      # The Dockerfile bakes this file in too; mounting it means a proxy or
      # upload-limit change takes effect on restart instead of needing the
      # whole client image rebuilt.
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo-data:
  redis-data:
  api_uploads:
